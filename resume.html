<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Diana Cornescu — Resume</title>
  <link rel="icon" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="assets/theme.css">
  <link rel="stylesheet" href="assets/styles.css">
  <script>(function(){try{var k=localStorage.getItem('diana-theme');var d=k?k==='dark':window.matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.setAttribute('data-theme',d?'dark':'light');}catch(e){}})();</script>
</head>
<body>

  <!-- ===================== TOP NAV BAR (same on every page) ===================== -->
  <header class="topbar">
    <a class="brand" href="index.html" aria-label="Home">
      <span class="avatar" data-field="initials">DC</span>
      <span class="brand-name" data-field="name">Diana Cornescu</span>
    </a>
    <nav class="topnav">
      <a class="nav-item" href="index.html" aria-label="About"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span class="label">About</span></a>
      <a class="nav-item" href="projects.html" aria-label="Projects"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg><span class="label">Projects</span></a>
      <a class="nav-item active" href="resume.html" aria-label="Resume"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8M8 17h6"/></svg><span class="label">Resume</span></a>
      <a class="nav-item" href="contact.html" aria-label="Contact"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 7l-10 6L2 7"/></svg><span class="label">Contact</span></a>
    </nav>
    <div class="top-actions">
      <button class="ghost-btn" id="themeToggle" aria-label="Toggle dark mode"></button>
      <a class="accent-btn" data-link="resume" href="assets/resume.pdf" aria-label="Download resume"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg><span class="label">Resume</span></a>
    </div>
  </header>

  <!-- ===================== PAGE CONTENT: Resume =====================
       Education and Experience are collapsible <details> dropdowns, filled
       from config.js (that's your personal info). Education is closed by
       default; Experience is open. The experience filter chips come from
       config.experienceFilters, and each bullet's cats decide what shows.
       (Skills now live as the filter at the top of the Projects page.)
       ================================================================== -->
  <div class="content">
    <div class="container container--wide">
      <!-- Resume download button sits where the page title used to be -->
      <div class="resume-dl-row">
        <a class="btn-primary" data-link="resume" href="assets/resume.pdf"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg> Download resume (PDF)</a>
      </div>

      <!-- TWO COLUMNS: Professional Experience (left) · Education + Skills (right) -->
      <div class="resume-cols">
        <!-- PROFESSIONAL EXPERIENCE — default OPEN -->
        <details class="acc" open>
          <summary class="acc-head">
            <span class="acc-title">Professional Experience</span>
            <span class="acc-chevron"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></span>
          </summary>
          <div class="acc-body">
            <!-- Click a chip to filter bullets by category (built from config.js) -->
            <div class="filterbar" data-list="exp-filters"></div>
            <div class="timeline" data-list="experience"></div>
          </div>
        </details>

        <!-- RIGHT COLUMN: Education, then Skills under it — both default OPEN -->
        <div class="resume-col">
          <details class="acc" open>
            <summary class="acc-head">
              <span class="acc-title">Education</span>
              <span class="acc-chevron"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></span>
            </summary>
            <div class="acc-body">
              <div class="timeline" data-list="education"></div>
            </div>
          </details>

          <details class="acc" open>
            <summary class="acc-head">
              <span class="acc-title">Skills</span>
              <span class="acc-chevron"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></span>
            </summary>
            <div class="acc-body">
              <div class="skill-groups" data-list="skill-categories"></div>
            </div>
          </details>
        </div>
      </div>

    </div>
  </div>

  <script>
    /* Load config + app fresh on every visit so edits always show (no stale cache). */
    (function () {
      var v = "?v=" + Date.now();
      ["config.js", "assets/app.js"].forEach(function (src) {
        var s = document.createElement("script");
        s.src = src + v; s.async = false;
        document.head.appendChild(s);
      });
    })();
  </script>
</body>
</html>
